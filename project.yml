name: CQUTmux
options:
  bundleIdPrefix: app.cqutmux
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  CQUTTransport:
    path: Packages/CQUTTransport
  CQUTMosh:
    path: Packages/CQUTMosh
  CQUTET:
    path: Packages/CQUTET
  CQUTWhisper:
    path: Packages/CQUTWhisper

targets:
  CQUTmuxWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
      - path: App/Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"

  CQUTmuxWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchWidgets
      - path: App/Shared/WatchPayload.swift
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/CQUTmuxWatchWidgets.entitlements

  CQUTmuxWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
      - path: App/Shared/WatchPayload.swift
    dependencies:
      - target: CQUTmuxWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Watch/CQUTmuxWatch.entitlements
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        WKApplication: true
        # Not an INFOPLIST_KEY_* setting — that route only covers a whitelist of
        # keys, and this one isn't on it. Without it the watch never pairs.
        WKCompanionAppBundleIdentifier: app.cqutmux.ios
        WKRunsIndependentlyOfCompanionApp: false

  CQUTmux:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      # The watch has its own target; these files would otherwise compile into
      # the phone app too, where WatchConnectivity is present but the watch UI
      # is not, and a second @main would break the build.
      - path: Watch
        excludes:
          - "**/*"
      # The terminal fonts. Declared as a resource rather than left to the
      # `App` source entry so the .ttf files land in the bundle root, which is
      # where `UIAppFonts` looks — a font in a subdirectory registers under a
      # name nobody asked for, and the PostScript lookup then silently falls
      # back to the system font.
      - path: App/Fonts
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: CQUTTransport
      - package: CQUTMosh
      - package: CQUTET
      - package: CQUTWhisper
      # libc++ and zlib: both drivers are C++, and mosh's compressor is zlib.
      # libresolv is ET's: ET's socket handler re-reads the resolver config
      # through res_9_init, which the other transports never touch.
      # The prebuilt archives are not listed here — they go in OTHER_LDFLAGS
      # below, because a `framework:` entry here emitted -lmoshclient without
      # the -L that would let the linker find it.
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libresolv.tbd
      - target: CQUTmuxWidgets
        embed: true
      - target: CQUTmuxWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios
        # Prebuilt iOS archives, from scripts/mosh-ios/ and scripts/et-ios/.
        # They are linked by path rather than declared as SwiftPM targets
        # because compiling them needs mosh's and ET's own source trees, which
        # only those scripts have.
        #
        # $(PLATFORM_NAME) picks the device or simulator build. They cannot be
        # combined into one archive: lipo refuses to merge two arm64 slices,
        # even though one is Mach-O platform 2 and the other 7.
        #
        # ET's archive contributes the protobuf *full* runtime, which is a
        # superset of the -lite one mosh needs. Only one may be linked — both
        # define the same symbols — and the full one serves both, so mosh links
        # against ET's copy and its own -lite archive stays in Vendor/ unused.
        # libsodium is ET's handshake; nothing else in the app uses it.
        OTHER_LDFLAGS: "$(inherited) -L$(SRCROOT)/Vendor/moshclient/$(PLATFORM_NAME) -lmoshclient -L$(SRCROOT)/Vendor/etclient/$(PLATFORM_NAME) -letcore -lprotobuf -lsodium -L$(SRCROOT)/Vendor/whisper/$(PLATFORM_NAME) -lwhisperclient -lwhisper -lparakeet -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -framework Metal -framework MetalKit -framework Accelerate -framework CoreML"
        CODE_SIGN_ENTITLEMENTS: App/CQUTmux.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your SSH keys stored in the Keychain."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictate commands into the terminal on-device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribe your voice locally to send commands. Apple's engine needs this even when it runs on-device."
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        # The file XcodeGen writes is the app's real Info.plist — it is not
        # merged with one checked in elsewhere — so a version written by hand
        # into App/Info.plist is overwritten on the next generate. That is how
        # this app spent its life reporting a version of `1.0` that nobody had
        # set while project.yml said 0.1.0. These two lines are the only place
        # the version is written; both read the build settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The preview loads http://127.0.0.1:<bridged port>, which ATS blocks by
        # default. It is loopback-only and the bytes are carried inside the SSH
        # session, so allowing local networking here exposes nothing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The key that lets this app start an activity at all. Without it
        # `Activity.request` throws "Target does not include
        # NSSupportsLiveActivities plist key" — and because the old code
        # swallowed that error with `try?`, the Live Activity looked implemented
        # while never once appearing. `NSSupportsLiveActivitiesFrequentUpdates`
        # is not set: the activity is updated from the poll, not pushed, so it
        # needs neither the budget nor the battery that flag asks for.
        NSSupportsLiveActivities: true
        # The fonts shipped in App/Fonts. Registering them here is what makes
        # `UIFont(name: "JetBrainsMono-Regular", …)` resolve at all — the files
        # being in the bundle is not enough, and a missing entry fails as
        # "renders in the system font" rather than as an error, which is the
        # one failure mode a font picker cannot show the user.
        #
        # All four are OFL 1.1; the licence text travels beside each family.
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - JetBrainsMono-Italic.ttf
          - JetBrainsMono-BoldItalic.ttf
          - IoskeleyMono-Regular.ttf
          - IoskeleyMono-Bold.ttf
          - Iosevka-Regular.ttf
          - Iosevka-Bold.ttf
          - DejaVuSansMono.ttf
          - DejaVuSansMono-Bold.ttf
        # Scanning a QR code: importing a theme, or pairing a host. Both are
        # behind the Scan tab of their own screen, so the camera is only ever
        # opened on a deliberate action and closed when that screen goes away.
        # The text has to cover both — it is one prompt for the whole app, and
        # naming only themes would misdescribe what someone pairing a host is
        # being asked to allow.
        NSCameraUsageDescription: >-
          Take a photo to send to the terminal, or scan a QR code to import a
          theme or pair a host. The camera is used only while one of those
          screens is open, and nothing is recorded.
        # Alternate app icons are declared as loose files rather than in an
        # asset catalog, because XcodeGen's asset support does not surface the
        # alternate-icon set. The PrimaryIcon entry is not optional: without it
        # iOS lists the alternate as the icon but cannot roll back to the
        # default, leaving no way out of the choice.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
        CFBundleAlternateIcons:
          CQUTmuxNebula:
            CFBundleIconFiles:
              - Nebula60x60
            UIPrerenderedIcon: false
          CQUTmuxAurora:
            CFBundleIconFiles:
              - Aurora60x60
            UIPrerenderedIcon: false
        # `cqutmux://tmux?session=…` opens straight onto a session. The scheme
        # is declared here rather than in App/Info.plist because XcodeGen
        # regenerates that file from these properties, so an edit made there is
        # silently reverted on the next `xcodegen generate`.
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: app.cqutmux.ios.link
            CFBundleURLSchemes:
              - cqutmux
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight