name: CQUTmux
options:
  bundleIdPrefix: app.cqutmux
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  CQUTTransport:
    path: Packages/CQUTTransport
  CQUTMosh:
    path: Packages/CQUTMosh

targets:
  CQUTmuxWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
      - path: App/Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"

  CQUTmuxWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
      - path: App/Shared/WatchPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        WKApplication: true
        # Not an INFOPLIST_KEY_* setting — that route only covers a whitelist of
        # keys, and this one isn't on it. Without it the watch never pairs.
        WKCompanionAppBundleIdentifier: app.cqutmux.ios
        WKRunsIndependentlyOfCompanionApp: false

  CQUTmux:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      # The watch has its own target; these files would otherwise compile into
      # the phone app too, where WatchConnectivity is present but the watch UI
      # is not, and a second @main would break the build.
      - path: Watch
        excludes:
          - "**/*"
    dependencies:
      - package: SwiftTerm
      - package: CQUTTransport
      - package: CQUTMosh
      # libc++ and zlib: the driver is C++, and mosh's compressor is zlib.
      # The two mosh archives are not listed here — they go in OTHER_LDFLAGS
      # below, because a `framework:` entry here emitted -lmoshclient without
      # the -L that would let the linker find it.
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - target: CQUTmuxWidgets
        embed: true
      - target: CQUTmuxWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios
        # Prebuilt iOS archives from scripts/mosh-ios/: libmoshclient.a is
        # mosh's client libraries plus the CQUTMosh driver, and protobuf-lite
        # is what its generated protocol code needs. They are linked by path
        # rather than declared as SwiftPM targets because compiling them needs
        # mosh's own source tree, which only that script has.
        OTHER_LDFLAGS: "$(inherited) -L$(SRCROOT)/Vendor/moshclient -lmoshclient -lprotobuf-lite"
        CODE_SIGN_ENTITLEMENTS: App/CQUTmux.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your SSH keys stored in the Keychain."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictate commands into the terminal on-device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribe your voice locally to send commands."
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        # The preview loads http://127.0.0.1:<bridged port>, which ATS blocks by
        # default. It is loopback-only and the bytes are carried inside the SSH
        # session, so allowing local networking here exposes nothing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight