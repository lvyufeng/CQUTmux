name: CQUTmux
options:
  bundleIdPrefix: app.cqutmux
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  CQUTTransport:
    path: Packages/CQUTTransport

targets:
  CQUTmuxWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
      - path: App/Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"

  CQUTmux:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
    dependencies:
      - package: SwiftTerm
      - package: CQUTTransport
      - target: CQUTmuxWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cqutmux.ios
        CODE_SIGN_ENTITLEMENTS: App/CQUTmux.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your SSH keys stored in the Keychain."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictate commands into the terminal on-device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribe your voice locally to send commands."
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CQUTmux
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight